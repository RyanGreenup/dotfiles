# Catppuccin Macchiato theme
include ./theme.conf

# Font
font_family      Fira Code
font_size        11.0

# Window
confirm_os_window_close 0
initial_window_width    900
initial_window_height   800
focus_follows_mouse     yes
window_padding_width    4

# Tab bar
tab_bar_style       powerline
tab_powerline_style round

# Clipboard: auto-copy selection to system clipboard
copy_on_select clipboard

# Paste without prompt
paste_actions quote-urls-at-prompt

# Remote control (for kitten @ / mcp-kitty)
allow_remote_control yes
listen_on            unix:/tmp/kitty-{kitty_pid}

# Shell integration (prompt marking, last command output, etc.)
shell_integration enabled

# Layouts (enable splits)
enabled_layouts splits,stack

# Keyboard shortcuts
map ctrl+c copy_or_interrupt

# --- Tabs (mirrors tmux Alt+number / Alt+o/i) ---
map alt+t       new_tab
map alt+w       close_tab
map alt+1       goto_tab 1
map alt+2       goto_tab 2
map alt+3       goto_tab 3
map alt+4       goto_tab 4
map alt+5       goto_tab 5
map alt+6       goto_tab 6
map alt+7       goto_tab 7
map alt+8       goto_tab 8
map alt+9       goto_tab 9
map alt+o       previous_tab
map alt+i       next_tab

# --- Splits (mirrors tmux-pain-control | and -) ---
map alt+\       launch --location vsplit --cwd current
map alt+-       launch --location hsplit --cwd current

# --- Navigate splits (mirrors tmux Alt+h/j/k/l) ---
map alt+h       neighboring_window left
map alt+j       neighboring_window bottom
map alt+k       neighboring_window top
map alt+l       neighboring_window right

# --- Resize splits (Alt+Shift+h/j/k/l) ---
map alt+shift+h resize_window narrower 4
map alt+shift+l resize_window wider 4
map alt+shift+k resize_window taller 4
map alt+shift+j resize_window shorter 4

# --- Zoom / close split ---
map alt+`       toggle_layout stack
map alt+x       close_window

# --- Scrollback in editor (for keyboard-driven copy) ---
map alt+s       launch --stdin-source=@screen_scrollback --type=overlay nvim -u NONE -c "set clipboard=unnamedplus nonumber norelativenumber signcolumn=no showtabline=0 foldcolumn=0 laststatus=0 buftype=nofile" -c "normal G" -
map alt+z       launch --stdin-source=@screen_scrollback --type=background sh -c 'mkdir -p "$HOME/.cache/kitty-scrollback"; tmp=$(mktemp "$HOME/.cache/kitty-scrollback/XXXXXX.txt"); cat > "$tmp"; flatpak run dev.zed.Zed-Preview "$tmp"'

# Hints (ctrl+shift+p > key)
map ctrl+shift+p>u kitten hints --type url --program @
map ctrl+shift+p>f kitten hints --type path --program @
map ctrl+shift+p>l kitten hints --type line --program @
map ctrl+shift+p>w kitten hints --type word --program @

# --- Keybinding cheat sheet (fzf overlay) ---
map alt+?       launch --type overlay ~/.config/kitty/kitty-keys

# Claude Code fork (ctrl+shift+c > key)
map ctrl+shift+c>h launch --type window --location hsplit -- claude code
map ctrl+shift+c>v launch --type window --location vsplit -- claude code
