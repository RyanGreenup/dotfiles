# Catppuccin Macchiato theme
include ./theme.conf

# Font
font_family      Fira Code
font_size        11.0

# Window
confirm_os_window_close 0
initial_window_width    900
initial_window_height   800
focus_follows_mouse     yes
window_padding_width    4

# Tab bar
tab_bar_style       powerline
tab_powerline_style round

# Clipboard: auto-copy selection to system clipboard
copy_on_select clipboard

# Paste without prompt
paste_actions quote-urls-at-prompt

# Remote control (for kitten @ / mcp-kitty)
allow_remote_control yes
listen_on            unix:/tmp/kitty-{kitty_pid}

# Shell integration (prompt marking, last command output, etc.)
shell_integration enabled

# Layouts (enable splits)
enabled_layouts splits,stack

# Keyboard shortcuts
map ctrl+c copy_or_interrupt

# --- Tabs (Ctrl+Shift+number / Ctrl+Shift+o/i) ---
map ctrl+shift+t       new_tab
map ctrl+shift+w       close_tab
map ctrl+shift+1       goto_tab 1
map ctrl+shift+2       goto_tab 2
map ctrl+shift+3       goto_tab 3
map ctrl+shift+4       goto_tab 4
map ctrl+shift+5       goto_tab 5
map ctrl+shift+6       goto_tab 6
map ctrl+shift+7       goto_tab 7
map ctrl+shift+8       goto_tab 8
map ctrl+shift+9       goto_tab 9
map ctrl+shift+o       previous_tab
map ctrl+shift+i       next_tab

# --- Splits (Alt+\ and Alt+-) ---
map alt+\       launch --location vsplit --cwd current
map alt+-       launch --location hsplit --cwd current

# --- Navigate splits (Alt+h/j/k/l) ---
map alt+h       neighboring_window left
map alt+j       neighboring_window bottom
map alt+k       neighboring_window top
map alt+l       neighboring_window right

# --- Resize splits (Ctrl+Alt+h/j/k/l) ---
map ctrl+alt+h resize_window narrower 4
map ctrl+alt+l resize_window wider 4
map ctrl+alt+k resize_window taller 4
map ctrl+alt+j resize_window shorter 4

# --- Zoom / close split ---
map alt+`       toggle_layout stack
map ctrl+shift+x       close_window

# --- Scrollback in editor (for keyboard-driven copy) ---
map ctrl+shift+s       launch --stdin-source=@screen_scrollback --type=overlay nvim -u NONE -c "set clipboard=unnamedplus nonumber norelativenumber signcolumn=no showtabline=0 foldcolumn=0 laststatus=0 buftype=nofile" -c "normal G" -
map ctrl+shift+z       launch --stdin-source=@screen_scrollback --type=background sh -c 'mkdir -p "$HOME/.cache/kitty-scrollback"; tmp=$(mktemp "$HOME/.cache/kitty-scrollback/XXXXXX.txt"); cat > "$tmp"; flatpak run dev.zed.Zed-Preview "$tmp"'

# Hints (ctrl+shift+p > key)
map ctrl+shift+p>u kitten hints --type url --program @
map ctrl+shift+p>f kitten hints --type path --program @
map ctrl+shift+p>l kitten hints --type line --program @
map ctrl+shift+p>w kitten hints --type word --program @

# --- Sessions (save / restore) ---
map ctrl+alt+s launch --type overlay ~/.config/kitty/kitty-save-session
map ctrl+alt+r launch --type overlay ~/.config/kitty/kitty-restore-session

# --- Window/tab naming ---
map ctrl+shift+n       set_window_title
map ctrl+alt+n         set_tab_title

# --- Window picker (fzf overlay) ---
map ctrl+shift+f       launch --type overlay ~/.config/kitty/kitty-window-picker

# --- Keybinding cheat sheet (fzf overlay) ---
map ctrl+shift+/       launch --type overlay ~/.config/kitty/kitty-keys

# Claude Code fork (ctrl+shift+c > key)
map ctrl+shift+c>h launch --type window --location hsplit -- claude code
map ctrl+shift+c>v launch --type window --location vsplit -- claude code
